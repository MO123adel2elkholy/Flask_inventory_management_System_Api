version: "3.8"

services:
  web:
    build: .
    image: flask_inventory_web:latest
    env_file:
      - ./docker.env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: >
      sh -c "gunicorn -k eventlet -w 1 ${WSGI_APP:-Ecommerce.app:app} -b 0.0.0.0:5000"

  worker:
    build: .
    image: flask_inventory_worker:latest
    env_file:
      - ./docker.env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped
    command: >
      sh -c "celery -A ${CELERY_APP} worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}"

  beat:
    build: .
    image: flask_inventory_beat:latest
    env_file:
      - ./docker.env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped
    command: >
      sh -c "celery -A ${CELERY_APP} beat --loglevel=info"

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: