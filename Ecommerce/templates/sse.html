<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SSE Test</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    .container-box {
      max-width: 700px;
      margin: 60px auto;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
    }

    .event-item {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      animation: fadeIn 0.3s ease-in;
    }

    .time {
      font-size: 12px;
      color: #9ca3af;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status {
      font-size: 13px;
    }

    .dot {
      height: 10px;
      width: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .online { background: #22c55e; }
    .offline { background: #ef4444; }
  </style>
</head>

<body>

<div class="container container-box">

  <div class="card p-3 mb-3">
    <h4 class="mb-2">📡 Server Sent Events</h4>

    <div class="status mb-2" id="status">
      <span class="dot offline"></span> Disconnected
    </div>

    <ul id="messages" class="list-unstyled mb-0"></ul>
  </div>

</div>

<script>
  const list = document.getElementById("messages");
  const status = document.getElementById("status");

  const evtSource = new EventSource("/events");

  evtSource.onopen = () => {
    status.innerHTML = `<span class="dot online"></span> Connected;`
  };

  evtSource.onerror = () => {
    status.innerHTML = `<span class="dot offline"></span>Disconnected (retrying...)`;
  };

  evtSource.onmessage = function (event) {
    try {
      const data = JSON.parse(event.data);

      const li = document.createElement("li");
      li.className = "event-item";

      li.innerHTML = 
       ` <div>${data.message}</div>
        <div class="time">🕒 ${data.time}</div>`
      ;

      list.prepend(li); // newest on top
    } catch (e) {
      console.error("Invalid JSON:", event.data);
    }
  };
</script>

</body>
</html>
